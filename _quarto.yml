project:
  type: book
  output-dir: _output/site

book:
  title: "Data Analysis with R"
  subtitle: "3-Day Workshop | IISc Bio Engineering"
  author:
    - name: "Dr. Arun Mitra"
      affiliations:
        - name: "Indian Institute of Science"
          department: "Bio Engineering"
  date: "January 6-8, 2025"
  date-format: "MMMM D, YYYY"

  page-navigation: true
  search: true

  sidebar:
    style: docked
    search: true
    collapse-level: 2

  chapters:
    - index.qmd

    - part: "Day 1: R Foundations"
      chapters:
        - materials/_day1/01_welcome.qmd
        - materials/_day1/02_r_fundamentals.qmd
        - materials/_day1/03_data_import.qmd
        - materials/_day1/04_tidyverse_intro.qmd
        - materials/_day1/05_dplyr_wrangling.qmd
        - materials/_day1/06_ggplot2_basics.qmd

    - part: "Day 2: Statistics & Analysis"
      chapters:
        - materials/_day2/01_descriptive_stats.qmd
        - materials/_day2/02_hypothesis_testing.qmd
        - materials/_day2/03_ttests.qmd
        - materials/_day2/04_anova.qmd
        - materials/_day2/05_correlation_regression.qmd
        - materials/_day2/06_your_data_workshop.qmd

    - part: "Day 3: Reporting & Communication"
      chapters:
        - materials/_day3/01_publication_figures.qmd
        - materials/_day3/02_multipanel_figures.qmd
        - materials/_day3/03_case_study_dfu.qmd
        - materials/_day3/04_quarto_reports.qmd
        - materials/_day3/05_mini_project.qmd

    - part: "Exercises"
      chapters:
        - exercises/day1_exercises.qmd
        - exercises/day2_exercises.qmd
        - exercises/day3_exercises.qmd

    - part: "Reference"
      chapters:
        - handouts/quick_reference.qmd
        - handouts/cheatsheet_dplyr.qmd
        - handouts/cheatsheet_ggplot2.qmd
        - handouts/cheatsheet_statistics.qmd

format:
  html:
    theme:
      light: [flatly, styles/custom.scss]
      dark: [darkly, styles/custom.scss]
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    number-sections: true
    anchor-sections: true

  pdf:
    documentclass: scrreprt
    papersize: a4
    colorlinks: true
    toc: true

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    echo: true
    fig.width: 8
    fig.height: 5
    fig.align: center
    fig.alt: "Figure generated from R code"

crossref:
  chapters: true

resources:
  - data/
  - slides/
