project:
  type: website
  output-dir: _output/site
  render:
    - index.qmd
    - schedule.qmd
    - materials/prerequisites.qmd

website:
  title: "BioEngineeR 2026"
  description: "R for Biomedical Research | 3-Day Workshop | IISc Bioengineering"
  
  navbar:
    title: "BioEngineeR 2026"
    logo: figures/BioEngineeR2026_final.png
    left:
      - text: "Home"
        href: index.qmd
      - text: "Set-up"
        href: materials/prerequisites.qmd
      - text: "Schedule"
        href: schedule.qmd
    right:
      - icon: github
        href: https://github.com/drarunmitra/BioEngineeR_2026
        aria-label: GitHub

  sidebar: false
  
  page-footer:
    left: "© 2026 BioEngineeR Workshop"
    right: "Department of Bioengineering, IISc Bangalore"

format:
  html:
    theme:
      light: [flatly, styles/custom.scss]
      dark: [darkly, styles/custom.scss]
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    number-sections: false
    anchor-sections: true

  pdf:
    documentclass: scrreprt
    papersize: a4
    colorlinks: true
    toc: true

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    echo: true
    fig.width: 8
    fig.height: 5
    fig.align: center
    fig.alt: "Figure generated from R code"

resources:
  - data/
  - slides/
  - figures/
